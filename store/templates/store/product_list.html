<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>

<body>

<h1>Products</h1>

{% for product in products %}

    <h2>{{ product.name }}</h2>

    <p>Price: Rs. {{ product.price }}</p>

    <a href="{% url 'checkout' product.id %}">
        Buy Now
    </a>

    <hr>

{% empty %}

    <p>No products available.</p>

{% endfor %}

</body>
</html>
